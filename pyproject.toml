[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ops-copilot"
version = "0.1.0"
description = "Human-in-the-loop support-ticket automation with policy guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nuno" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ops-copilot = "ops_copilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_copilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

